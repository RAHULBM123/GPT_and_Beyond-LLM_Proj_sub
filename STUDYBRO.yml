app:
  description: '*1. Study Schedule Creation:*

    - *User Input:* "Create a study schedule for my exams."

    - *Agent Response:* "Sure! Please provide your exam dates and subjects, and I’ll
    create a study plan for you."


    #### *2. Task Breakdown:*

    - *User Input:* "Break down my Chemistry syllabus."

    - *Agent Response:* "Let’s break it down! How many chapters do you have, and when
    is your exam?"


    #### *3. Pomodoro Timer:*

    - *User Input:* "Start a Pomodoro session."

    - *Agent Response:* "Starting a Pomodoro session: 25 minutes of focused study.
    I’ll remind you to take a break!"


    #### *4. Resource Recommendation:*

    - *User Input:* "Suggest resources for Physics."

    - *Agent Response:* "Here are some great resources for Physics: [Link 1], [Link
    2], [Link 3]."


    #### *5. Deadline Reminder:*

    - *User Input:* "Remind me about my Math assignment."

    - *Agent Response:* "Sure! When is your Math assignment due?"'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: STUDYBRO
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .MPGA
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-4o-mini
    provider: openai
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: ''
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.5
